name: Post JMty items to Discord

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.10'

    - name: Install dependencies
      run: uv pip install -r requirements.txt --system

    - name: Run jmty-car_parts.py
      run: python jmty-car_parts.py
      env:
        DISCORD_WEBHOOK_URL_HAKODATE: ${{ secrets.DISCORD_WEBHOOK_URL_HAKODATE }}
        DISCORD_WEBHOOK_URL_HOKUTO:   ${{ secrets.DISCORD_WEBHOOK_URL_HOKUTO   }}
        DISCORD_WEBHOOK_URL_KAMIISO:  ${{ secrets.DISCORD_WEBHOOK_URL_KAMIISO  }}
        DISCORD_WEBHOOK_URL_KAMEDA:   ${{ secrets.DISCORD_WEBHOOK_URL_KAMEDA   }}

    - name: Run jmty-cars_hokkaido.py
      run: python jmty-cars_hokkaido.py
      env:
        DISCORD_WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL_1 }}
